name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays, after race weekends
    - cron: "0 6 * * 4"   # Thursdays, before them
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: fastf1-cache
          key: fastf1-${{ github.run_id }}
          restore-keys: fastf1-

      - name: Build schedule, circuit maps and the latest race replay
        run: python build_data.py
        continue-on-error: true

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          if [ -d data ]; then cp -r data site/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
